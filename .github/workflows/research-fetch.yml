name: Research fetch (temporary)

# TEMPORARY — lives only on the claude/wow-addon-analysis-* working branch.
# Reads one public Reddit thread (competitor-launch reception research).
# reddit.com blocks datacenter IPs, so this walks a ladder of public mirrors
# and readers, emitting the first usable text straight into the job log.
# Nothing is committed and no refs are pushed. Delete this file when done.

on:
  push:
    branches:
      - 'claude/wow-addon-analysis-*'
    paths:
      - '.github/workflows/research-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch thread text via mirror ladder
        shell: bash
        run: |
          set -uo pipefail
          T="1vd71cf"
          P="r/wowaddons/comments/$T"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          mkdir -p out
          grab() { curl -sSL -m 45 -A "$UA" -o "$2" -w '%{http_code}' "$1" 2>/dev/null || echo ERR; }
          strip() { tr '\n' ' ' < "$1" | sed -e 's/<script[^<]*<\/script>/ /g' -e 's/<style[^<]*<\/style>/ /g' -e 's/<[^>]*>/ /g' -e 's/&#32;/ /g' | tr -s ' '; }
          emit() { echo "=====SOURCE: $1====="; echo "=====THREAD_TEXT_BEGIN====="; cat; echo; echo "=====THREAD_TEXT_END====="; }

          echo "[1] pullpush.io"
          c1=$(grab "https://api.pullpush.io/reddit/search/submission/?ids=$T" out/sub.json)
          c2=$(grab "https://api.pullpush.io/reddit/search/comment/?link_id=$T&size=100" out/com.json)
          echo "    submission=$c1 comments=$c2"
          if jq -e '.data | length > 0' out/com.json >/dev/null 2>&1; then
            { jq -r '.data[0] | "TITLE: \(.title)\nAUTHOR: u/\(.author) | score \(.score)\nSELFTEXT:\n\(.selftext)"' out/sub.json 2>/dev/null
              echo "=====COMMENTS (by score)====="
              jq -r '.data | sort_by(-.score) | .[] | "---\nu/\(.author) | score \(.score)\n\(.body)"' out/com.json
            } | head -c 42000 | emit "pullpush.io"
            exit 0
          fi

          echo "[2] r.jina.ai reader"
          for target in "https://old.reddit.com/$P/" "https://www.reddit.com/$P/"; do
            code=$(grab "https://r.jina.ai/$target" out/jina.txt)
            bytes=$(wc -c < out/jina.txt 2>/dev/null || echo 0)
            echo "    $target -> $code ($bytes bytes)"
            if [ "$code" = "200" ] && [ "$bytes" -gt 2500 ] && ! grep -qiE "just a moment|are you a human|blocked|network security" out/jina.txt; then
              head -c 42000 out/jina.txt | emit "r.jina.ai <- $target"
              exit 0
            fi
          done

          echo "[3] reddit RSS"
          code=$(grab "https://www.reddit.com/$P/.rss?limit=500" out/feed.xml)
          echo "    rss -> $code ($(wc -c < out/feed.xml 2>/dev/null || echo 0) bytes)"
          if [ "$code" = "200" ] && grep -q "<entry" out/feed.xml; then
            strip out/feed.xml | head -c 42000 | emit "reddit-rss"
            exit 0
          fi

          echo "[4] redlib mirrors"
          for m in redlib.catsarch.com redlib.perennialte.ch safereddit.com l.opnxng.com redlib.privacyredirect.com; do
            code=$(grab "https://$m/$P" out/redlib.html)
            bytes=$(wc -c < out/redlib.html 2>/dev/null || echo 0)
            echo "    $m -> $code ($bytes bytes)"
            if [ "$code" = "200" ] && grep -qi "paka" out/redlib.html; then
              strip out/redlib.html | head -c 42000 | emit "redlib:$m"
              exit 0
            fi
          done

          echo "[5] wayback machine"
          for attempt in 1 2 3; do
            code=$(grab "http://archive.org/wayback/available?url=old.reddit.com/$P" out/avail.json)
            snap=$(jq -r '.archived_snapshots.closest.url // empty' out/avail.json 2>/dev/null)
            if [ -n "$snap" ]; then
              code=$(grab "$snap" out/wb.html)
              echo "    snapshot $snap -> $code"
              if [ "$code" = "200" ] && grep -qi "paka" out/wb.html; then
                strip out/wb.html | head -c 42000 | emit "wayback:$snap"
                exit 0
              fi
            fi
            if [ "$attempt" = "1" ]; then
              echo "    no snapshot; requesting save-page-now (may take a while)"
              grab "https://web.archive.org/save/https://old.reddit.com/$P/" out/spn.html >/dev/null
              sleep 45
            else
              sleep 20
            fi
          done

          echo "FATAL: every mirror route failed"
          exit 1
