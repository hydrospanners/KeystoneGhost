name: Research fetch (temporary)

# TEMPORARY — cleanup stage. The fetch is done; this run only deletes the
# transient handoff ref. The file itself is removed in the next commit.

on:
  push:
    branches:
      - 'claude/wow-addon-analysis-*'
    paths:
      - '.github/workflows/research-fetch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete transient handoff ref
        shell: bash
        run: |
          set -euo pipefail
          git init -q scratch && cd scratch
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" :refs/research/paka-fetch || echo "[cleanup] ref already gone"
          echo "[cleanup] done"
        env:
          GITHUB_TOKEN: ${{ github.token }}
